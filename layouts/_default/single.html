{{ define "main" }}
<article class="content">
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}
    <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Mon, 02 Jan 2006" }}</time></p>
  {{ end }}

  {{ .Content }}

  {{ with .GetTerms "tags" }}
    <ul class="tag-pills">
      {{ range . }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
    </ul>
  {{ end }}
</article>
{{ end }}
