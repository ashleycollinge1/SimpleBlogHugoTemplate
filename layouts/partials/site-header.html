<header class="site-header">
  <div class="site-header__bar">
    <a class="site-header__title" href="{{ "/" | relLangURL }}">
      {{ with .Site.Params.profileImage }}
        <img class="site-header__avatar" src="{{ . | relURL }}" alt="" width="28" height="28">
      {{ end }}
      <span>{{ .Site.Title }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav-list">
        Menu
      </button>
      <ul class="site-nav__list" id="site-nav-list">
        {{ range .Site.Menus.main }}
          <li>
            <a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
