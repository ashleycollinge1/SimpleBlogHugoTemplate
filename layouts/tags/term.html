{{ define "main" }}
<h1>{{ .Title }}</h1>

<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Mon, 02 Jan 2006" }}</time>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </li>
  {{ end }}
</ul>

<p><a href="{{ "/tags/" | relLangURL }}">&larr; All tags</a></p>
{{ end }}
